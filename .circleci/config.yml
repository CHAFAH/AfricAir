version: 2.1

orbs:
  aws-cli: circleci/aws-cli@5.1.1

executors:
  node:
    docker:
      - image: cimg/node:22.21
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: africair
          POSTGRES_DB: africair_test
          POSTGRES_PASSWORD: ci-only-password
    environment:
      TEST_DATABASE_URL: postgres://africair:ci-only-password@localhost:5432/africair_test
  builder:
    machine:
      image: ubuntu-2404:current

commands:
  setup:
    steps:
      - checkout
      - run: sudo corepack enable && pnpm install --frozen-lockfile

  aws-oidc:
    steps:
      - aws-cli/install
      - run:
          name: Assume role
          command: |
            creds=$(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" \
              --role-session-name "circleci-${CIRCLE_BUILD_NUM}" --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
              --query Credentials --output json)
            echo "export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<$creds)" >> $BASH_ENV
            echo "export AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<$creds)" >> $BASH_ENV
            echo "export AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<$creds)" >> $BASH_ENV
            echo "export AWS_REGION=${AWS_REGION:-eu-west-1}" >> $BASH_ENV

jobs:
  test:
    executor: node
    steps:
      - setup
      - run: for i in $(seq 30); do (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null && break; sleep 1; done
      - run: pnpm check && pnpm test

  images:
    parameters:
      push: { type: boolean, default: false }
    executor: builder
    steps:
      - checkout
      - run: |
          docker build -f Dockerfile.web -t africair-web:$CIRCLE_SHA1 .
          docker build -f Dockerfile.api -t africair-api:$CIRCLE_SHA1 .
      - when:
          condition: << parameters.push >>
          steps:
            - aws-oidc
            - run: |
                registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
                aws ecr get-login-password | docker login --username AWS --password-stdin $registry
                for img in web api; do
                  docker tag africair-$img:$CIRCLE_SHA1 $registry/africair-$img:$CIRCLE_SHA1
                  docker tag africair-$img:$CIRCLE_SHA1 $registry/africair-$img:latest
                  docker push $registry/africair-$img:$CIRCLE_SHA1
                  docker push $registry/africair-$img:latest
                done

  deploy:
    executor: node
    steps:
      - checkout
      - aws-oidc
      - run: |
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl
          sudo install /tmp/kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run:
          name: Update image values
          command: |
            registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
            sed -i "s|REGISTRY_PLACEHOLDER|$registry|" deploy/helm/africair/values-staging.yaml
            sed -i "s|TAG_PLACEHOLDER|$CIRCLE_SHA1|" deploy/helm/africair/values-staging.yaml
      - run: |
          aws eks update-kubeconfig --name africair-stg-cluster --region $AWS_REGION
          helm upgrade --install africair deploy/helm/africair \
            -f deploy/helm/africair/values-staging.yaml

workflows:
  ci:
    jobs:
      - test
      - images:
          requires: [test]
          filters: { branches: { ignore: main } }
      - images:
          name: images-push
          push: true
          context: africair-staging
          requires: [test]
          filters: { branches: { only: main } }
      - deploy:
          context: africair-staging
          requires: [images-push]
          filters: { branches: { only: main } }
