version: 2.1

# Same pipeline as .github/workflows/ci.yml:
#   every branch: verify → unit (node 20/22 + PostgreSQL) · build → e2e (2 parallel shards) · images (build + scan)
#   main:         images pushed to ECR (:<sha>, :latest) → helm upgrade on the staging cluster → smoke test
# Setup: create the context "africair-staging" with AWS_ROLE_ARN = `terraform output ci_role_arn`
# (set circleci_org_id / circleci_project_id in terraform/stg.tfvars first) and AWS_REGION.

orbs:
  aws-cli: circleci/aws-cli@5.1.1

executors:
  node:
    parameters:
      version: { type: string, default: "22.21" }
    docker:
      - image: cimg/node:<< parameters.version >>
  node-postgres:
    parameters:
      version: { type: string, default: "22.21" }
    docker:
      - image: cimg/node:<< parameters.version >>
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: africair
          POSTGRES_DB: africair_test
          POSTGRES_PASSWORD: ci-only-password
    environment:
      TEST_DATABASE_URL: postgres://africair:ci-only-password@localhost:5432/africair_test
  playwright:
    docker:
      - image: mcr.microsoft.com/playwright:v1.64.0-noble
    resource_class: large
  builder:
    machine:
      image: ubuntu-2404:current

commands:
  setup:
    description: corepack + pnpm store cache keyed on the lockfile + frozen install
    parameters:
      cache-prefix: { type: string, default: pnpm-v1 }
    steps:
      - checkout
      - run:
          name: Enable corepack
          command: |
            sudo corepack enable 2>/dev/null || corepack enable
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - << parameters.cache-prefix >>-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - << parameters.cache-prefix >>-{{ arch }}-
      - run: pnpm install --frozen-lockfile
      - save_cache:
          key: << parameters.cache-prefix >>-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths: [~/.pnpm-store]

  aws-oidc:
    description: Exchange the CircleCI OIDC token for short-lived AWS credentials (no stored keys)
    steps:
      - aws-cli/install
      - run:
          name: Assume AWS_ROLE_ARN
          command: |
            creds=$(aws sts assume-role-with-web-identity --role-arn "$AWS_ROLE_ARN" \
              --role-session-name "circleci-${CIRCLE_BUILD_NUM}" --web-identity-token "$CIRCLE_OIDC_TOKEN_V2" \
              --query Credentials --output json)
            {
              echo "export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$creds")"
              echo "export AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$creds")"
              echo "export AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$creds")"
              echo "export AWS_REGION=${AWS_REGION:-eu-west-1} AWS_DEFAULT_REGION=${AWS_REGION:-eu-west-1}"
            } >> "$BASH_ENV"

jobs:
  verify:
    executor: node
    steps:
      - setup
      - run: pnpm check
      - run: pnpm audit --audit-level=high

  unit:
    parameters:
      node: { type: string }
    executor:
      name: node-postgres
      version: << parameters.node >>
    steps:
      - setup:
          cache-prefix: pnpm-node<< parameters.node >>
      - run:
          name: Wait for PostgreSQL
          command: for i in $(seq 30); do (exec 3<>/dev/tcp/localhost/5432) 2>/dev/null && exit 0; sleep 1; done; exit 1
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=test-results/unit/results.xml
      - store_test_results: { path: test-results }

  build:
    executor: node
    steps:
      - setup
      - run: pnpm build && pnpm build:api
      - persist_to_workspace: { root: ., paths: [dist] }

  e2e:
    executor: playwright
    parallelism: 2
    environment:
      CI: "true"
    steps:
      - setup:
          cache-prefix: pnpm-playwright
      - attach_workspace: { at: . }
      - run:
          name: e2e shard
          command: |
            pnpm exec vite preview --port 4173 --strictPort &
            npx --yes wait-on@8 -t 30000 http://localhost:4173
            BASE_URL=http://localhost:4173 pnpm test:e2e --shard=$((CIRCLE_NODE_INDEX + 1))/$CIRCLE_NODE_TOTAL
      - store_test_results: { path: test-results }
      - store_artifacts: { path: playwright-report }

  images:
    parameters:
      push: { type: boolean, default: false }
    executor: builder
    steps:
      - checkout
      - run:
          name: Build both images (tests run inside the build)
          command: |
            for img in web api; do
              docker buildx build --load -f "Dockerfile.$img" --build-arg "VERSION=${CIRCLE_SHA1:0:7}" \
                --build-arg "GIT_SHA=$CIRCLE_SHA1" --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                -t "africair-$img:$CIRCLE_SHA1" .
            done
      - run:
          name: Trivy (fails on CRITICAL)
          command: |
            for img in web api; do
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --quiet \
                --severity CRITICAL --exit-code 1 "africair-$img:$CIRCLE_SHA1"
            done
      - when:
          condition: << parameters.push >>
          steps:
            - aws-oidc
            - run:
                name: Push :<sha> and :latest to ECR
                command: |
                  registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
                  aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
                  for img in web api; do
                    for tag in "$CIRCLE_SHA1" latest; do
                      docker tag "africair-$img:$CIRCLE_SHA1" "$registry/africair-$img:$tag"
                      docker push --quiet "$registry/africair-$img:$tag"
                    done
                  done

  deploy-staging:
    executor: node
    steps:
      - checkout
      - aws-oidc
      - run:
          name: Install kubectl and helm
          command: |
            curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl"
            sudo install /tmp/kubectl /usr/local/bin/kubectl
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - run:
          name: helm upgrade
          command: |
            aws eks update-kubeconfig --name "${EKS_CLUSTER:-africair-stg-cluster}" --region "$AWS_REGION"
            registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
            helm upgrade --install africair deploy/helm/africair -n africair-staging \
              -f deploy/helm/africair/values-staging.yaml \
              --set image.registry="$registry" --set image.tag="$CIRCLE_SHA1" --wait --timeout 10m
      - run:
          name: Smoke test
          command: |
            host=$(kubectl -n africair-staging get ingress africair -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            scripts/ci/smoke.sh "http://$host" "$CIRCLE_SHA1" staging

workflows:
  ci:
    jobs:
      - verify
      - unit:
          requires: [verify]
          matrix:
            parameters:
              node: ["20.19", "22.21"]
      - build:
          requires: [verify]
      - e2e:
          requires: [build]
      - images:
          name: images-scan
          requires: [verify]
          filters: { branches: { ignore: main } }
      - images:
          name: images-push
          push: true
          context: africair-staging
          requires: [verify]
          filters: { branches: { only: main } }
      - deploy-staging:
          context: africair-staging
          requires: [unit, e2e, images-push]
          filters: { branches: { only: main } }
