apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.14.1
      helm:
        releaseName: monitoring
        valueFiles: [$values/gitops/values/monitoring.yaml]
    - repoURL: https://github.com/CHAFAH/AfricAir.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    # The operator's CRDs exceed the 256 KB last-applied annotation limit of client-side apply.
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
