apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: africair-staging
  namespace: argocd
spec:
  project: africair
  sources:
    - repoURL: https://github.com/CHAFAH/AfricAir.git
      targetRevision: main
      path: deploy/helm/africair
      helm:
        releaseName: africair
        valueFiles:
          - $values/gitops/values/cluster.yaml
          - $values/gitops/values/africair-staging.yaml
    - repoURL: https://github.com/CHAFAH/AfricAir.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
