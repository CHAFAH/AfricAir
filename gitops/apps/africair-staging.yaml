# Staging follows main: CI commits image.tag to gitops/values/africair-staging.yaml after every green build.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: africair-staging
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: africair-deploys
    notifications.argoproj.io/subscribe.on-health-degraded.slack: africair-deploys
spec:
  project: africair
  sources:
    - repoURL: https://github.com/CHAFAH/AfricAir.git
      targetRevision: main
      path: deploy/helm/africair
      helm:
        releaseName: africair
        valueFiles: [$values/gitops/values/cluster.yaml, $values/gitops/values/africair-staging.yaml]
    - repoURL: https://github.com/CHAFAH/AfricAir.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: africair-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    managedNamespaceMetadata:
      labels:
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
    retry:
      limit: 3
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
  # The HPA owns replicas: ignore the field so a scale-out is not "drift".
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
