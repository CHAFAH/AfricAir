apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: africair
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: AfricAir staging
  sourceRepos:
    - https://github.com/CHAFAH/AfricAir.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
