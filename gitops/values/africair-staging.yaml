# Staging: the Project 4 chart, managed by Argo CD. CI (gitops-bump job) rewrites image.tag.
gitops:
  enabled: true

image:
  tag: "0000000000000000000000000000000000000000"   # quoted: an all-digit SHA would be a YAML number

web:
  env:
    APP_ENV: staging

api:
  env:
    APP_ENV: staging
    BRAND_NAME: AfricAir Staging
    ANNOUNCEMENT_TEXT: "Running on Amazon EKS — staging, deployed by Argo CD"
    ANNOUNCEMENT_LEVEL: info
    SERVICE_FEE_USD: "7"
    DEFAULT_CURRENCY: KES
    MAINTENANCE_MODE: "false"
    DB_SSL: require

secrets:
  appSecretName: africair/stg/app

ingress:
  groupName: africair
  host: ""            # staging.<domain>

backup:
  enabled: false   # no backup bucket in the simplified staging infrastructure

metrics:
  serviceMonitor:
    enabled: true
