# Staging: the Project 4 chart, managed by Argo CD. CI (gitops-bump job) rewrites image.tag.
gitops:
  enabled: true

image:
  registry: 123456789012.dkr.ecr.eu-west-1.amazonaws.com
  tag: "0000000000000000000000000000000000000000"   # quoted: an all-digit SHA would be a YAML number

web:
  env:
    APP_ENV: staging

api:
  env:
    APP_ENV: staging
    BRAND_NAME: AfricAir Staging
    ANNOUNCEMENT_TEXT: "Running on Amazon EKS — staging, deployed by Argo CD"
    ANNOUNCEMENT_LEVEL: info
    SERVICE_FEE_USD: "7"
    DEFAULT_CURRENCY: KES
    MAINTENANCE_MODE: "false"
    DB_SSL: require

secrets:
  appSecretName: africair/staging/app
  dbMasterSecretArn: arn:aws:secretsmanager:eu-west-1:123456789012:secret:rds!db-00000000-0000-0000-0000-000000000000-AbCdEf
  dbParameterPrefix: /africair/staging/db

ingress:
  groupName: africair
  host: ""            # staging.<domain>
  certificateArn: ""

backup:
  enabled: true
  bucket: africair-team1-staging-backups-123456789012
  prefix: africair/staging

metrics:
  serviceMonitor:
    enabled: true
