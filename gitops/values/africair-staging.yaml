gitops:
  enabled: true

image:
  tag: "adb92c7d76da9d2a2ee87aced726b87800170fda"

web:
  replicas: 1
  env:
    APP_ENV: staging

api:
  replicas: 1
  env:
    APP_ENV: staging
    BRAND_NAME: AfricAir Staging
    ANNOUNCEMENT_TEXT: "Running on Amazon EKS — deployed by Argo CD"
    ANNOUNCEMENT_LEVEL: info
    SERVICE_FEE_USD: "7"
    DEFAULT_CURRENCY: KES
    MAINTENANCE_MODE: "false"
    DB_SSL: require

secrets:
  externalSecrets: false
  appSecretName: africair/stg/app
  dbSecretName: africair/stg/db

ingress:
  host: ""
  certificateArn: ""

autoscaling:
  enabled: false

migrations:
  enabled: true

networkPolicy:
  enabled: false

backup:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false
