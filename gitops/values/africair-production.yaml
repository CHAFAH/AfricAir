# Production: same chart (pinned to a release tag in apps/africair-production.yaml), visibly different
# settings: no environment banner, no announcement, USD, $15 fee, its own Secrets Manager secret.
gitops:
  enabled: true

image:
  tag: v1.0            # an image tag pushed to ECR

web:
  env:
    APP_ENV: production

api:
  env:
    APP_ENV: production          # no environment banner
    BRAND_NAME: AfricAir
    ANNOUNCEMENT_TEXT: ""
    SERVICE_FEE_USD: "15"
    DEFAULT_CURRENCY: USD
    MAINTENANCE_MODE: "false"
    DB_SSL: require

secrets:
  appSecretName: africair/production/app   # a different Secrets Manager secret
  # Bootcamp trade-off: production shares the staging RDS instance and database (cluster.yaml). A real
  # production gets its own RDS and discovery parameters.

ingress:
  # Without a domain, two host-less Ingresses in one ALB group would collide on "/": production gets its
  # own ALB. With a domain, use group "africair" and host www.<domain>.
  groupName: africair-production
  host: ""

autoscaling:
  minReplicas: 2
  maxReplicas: 6

backup:
  enabled: false   # the backup Pod Identity role is scoped to africair-staging

metrics:
  serviceMonitor:
    enabled: true
