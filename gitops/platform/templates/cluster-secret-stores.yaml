# Wave -2: every ExternalSecret (here and in the app charts) needs these. ESO authenticates with its own
# Pod Identity role (Terraform modules/platform): no credentials in the store spec.
{{- range $name, $service := dict "aws-secrets-manager" "SecretsManager" "aws-parameter-store" "ParameterStore" }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: {{ $service }}
      region: {{ $.Values.region }}
---
{{- end }}
