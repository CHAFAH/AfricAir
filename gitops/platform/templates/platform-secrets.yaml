# Wave -1: credentials for the platform tools, from Secrets Manager. Nothing secret is in Git.

# Argo CD admin password: Secrets Manager holds a bcrypt HASH (not the password). Hashing in an ESO
# template would produce a new salt, so a different hash, on every refresh: Argo CD would see a changed
# password and log everyone out each time. Merge: the chart creates argocd-secret, ESO adds two keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-admin-password
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: admin.password
      remoteRef: { key: {{ .Values.secrets.argocd }}, property: adminPasswordBcrypt }
    - secretKey: admin.passwordMtime
      remoteRef: { key: {{ .Values.secrets.argocd }}, property: adminPasswordMtime }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-slack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: argocd-notifications-secret
    creationPolicy: Merge
  data:
    - secretKey: slack-token
      remoteRef: { key: {{ .Values.secrets.argocd }}, property: slackToken }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef: { key: {{ .Values.secrets.grafana }}, property: adminUser }
    - secretKey: admin-password
      remoteRef: { key: {{ .Values.secrets.grafana }}, property: adminPassword }
---
# The whole Alertmanager configuration (routing as code) is rendered here; only the webhook URLs are
# secret. Alertmanager's default Slack message templates are used, so this file needs no Alertmanager
# template syntax (which would clash with the ESO and Helm template engines).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-africair
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: alertmanager-africair
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            receiver: chat
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - matchers: ['alertname = "Watchdog"']        # always firing: proves the pipeline works
                receiver: deadmans-switch
                repeat_interval: 1m
              - matchers: ['alertname = "InfoInhibitor"']
                receiver: "null"
              - matchers: ['severity = "critical"']
                receiver: page
              - matchers: ['severity =~ "warning|info"']
                receiver: chat
          inhibit_rules:
            # While a critical alert fires in a namespace, its warnings are noise.
            - source_matchers: ['severity = "critical"']
              target_matchers: ['severity = "warning"']
              equal: [namespace]
          receivers:
            - name: "null"
            - name: page
              slack_configs:
                - api_url: {{ `"{{ .pageWebhookUrl }}"` }}
                  channel: {{ .Values.alertmanager.pageChannel | quote }}
                  send_resolved: true
            - name: chat
              slack_configs:
                - api_url: {{ `"{{ .slackWebhookUrl }}"` }}
                  channel: {{ .Values.alertmanager.chatChannel | quote }}
                  send_resolved: true
            - name: deadmans-switch
              webhook_configs:
                - url: {{ `"{{ .deadmansSwitchUrl }}"` }}
                  send_resolved: false
  data:
    - secretKey: slackWebhookUrl
      remoteRef: { key: {{ .Values.secrets.alertmanager }}, property: slackWebhookUrl }
    - secretKey: pageWebhookUrl
      remoteRef: { key: {{ .Values.secrets.alertmanager }}, property: pageWebhookUrl }
    - secretKey: deadmansSwitchUrl
      remoteRef: { key: {{ .Values.secrets.alertmanager }}, property: deadmansSwitchUrl }
