# The only Application applied by hand (once, after Argo CD is installed):
#   kubectl apply -n argocd -f gitops/bootstrap/root-app.yaml
# Everything else in gitops/apps/ is created and managed by this app-of-apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CHAFAH/AfricAir.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
