name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: africair_test
          POSTGRES_USER: africair
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U africair" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://africair:ci-only-password@localhost:5432/africair_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f Dockerfile.web -t africair-web:$GITHUB_SHA .
          docker build -f Dockerfile.api -t africair-api:$GITHUB_SHA .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for img in web api; do
            docker tag africair-$img:$GITHUB_SHA $REGISTRY/africair-$img:$GITHUB_SHA
            docker tag africair-$img:$GITHUB_SHA $REGISTRY/africair-$img:latest
            docker push $REGISTRY/africair-$img:$GITHUB_SHA
            docker push $REGISTRY/africair-$img:latest
          done

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - name: Update image values
        run: |
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
          sed -i "s|REGISTRY_PLACEHOLDER|$registry|" deploy/helm/africair/values-staging.yaml
          sed -i "s|TAG_PLACEHOLDER|$GITHUB_SHA|" deploy/helm/africair/values-staging.yaml
      - name: Create Kubernetes secrets from Secrets Manager
        run: |
          aws eks update-kubeconfig --name africair-stg-cluster --region $AWS_REGION
          DB_URL=$(aws secretsmanager get-secret-value --secret-id africair/stg/db --query SecretString --output text | python3 -c "import sys,json; print(json.load(sys.stdin)['DATABASE_URL'])")
          APP=$(aws secretsmanager get-secret-value --secret-id africair/stg/app --query SecretString --output text)
          ADMIN_TOKEN=$(echo $APP | python3 -c "import sys,json; print(json.load(sys.stdin)['ADMIN_TOKEN'])")
          PROMO_CODES=$(echo $APP | python3 -c "import sys,json; print(json.load(sys.stdin)['PROMO_CODES'])")
          kubectl create secret generic africair-db --from-literal=DATABASE_URL="$DB_URL" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic africair-app --from-literal=ADMIN_TOKEN="$ADMIN_TOKEN" --from-literal=PROMO_CODES="$PROMO_CODES" --dry-run=client -o yaml | kubectl apply -f -
      - run: |
          helm upgrade --install africair deploy/helm/africair \
            -f deploy/helm/africair/values-staging.yaml

  gitops-bump:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump image tag in gitops values
        run: |
          sed -i "s|^  tag: .*|  tag: \"$GITHUB_SHA\"|" gitops/values/africair-staging.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gitops/values/africair-staging.yaml
          git diff --cached --quiet || git commit -m "chore: bump staging image tag to $GITHUB_SHA"
          git push
