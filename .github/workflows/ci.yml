name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: africair_test
          POSTGRES_USER: africair
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U africair" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://africair:ci-only-password@localhost:5432/africair_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f Dockerfile.web -t africair-web:$GITHUB_SHA .
          docker build -f Dockerfile.api -t africair-api:$GITHUB_SHA .
      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        if: github.ref == 'refs/heads/main'
        id: ecr
      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for img in web api; do
            docker tag africair-$img:$GITHUB_SHA $REGISTRY/africair-$img:$GITHUB_SHA
            docker tag africair-$img:$GITHUB_SHA $REGISTRY/africair-$img:latest
            docker push $REGISTRY/africair-$img:$GITHUB_SHA
            docker push $REGISTRY/africair-$img:latest
          done

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/setup-helm@v4
      - run: |
          aws eks update-kubeconfig --name africair-stg-cluster --region $AWS_REGION
          registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com
          helm upgrade --install africair deploy/helm/africair -n africair-staging \
            -f deploy/helm/africair/values-staging.yaml \
            --set image.registry=$registry --set image.tag=$GITHUB_SHA --wait --timeout 10m
