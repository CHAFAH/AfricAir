# Applied once after External Secrets Operator is installed (`make cluster-secret-stores`).
# Project 5 moves this file to gitops/platform/ (sync wave -2).
# Authentication: no auth block. ESO's own service account (external-secrets/external-secrets) gets AWS
# credentials from its EKS Pod Identity association, through the default AWS SDK credential chain.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-west-1
