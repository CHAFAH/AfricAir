# Runs on the CI-deployed EC2 container hosts (staging, production). Images come from ECR by tag;
# nothing is built here. deploy.sh renders ./secrets from Secrets Manager and sets the variables below.
#   REGISTRY   <account>.dkr.ecr.<region>.amazonaws.com
#   IMAGE_TAG  <git-sha> (staging) or vX.Y.Z (production): both point at the same digest
#   APP_ENV    staging | production
name: africair

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  pids_limit: 100
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: africair
      POSTGRES_USER: africair
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U africair -d africair"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  migrate:
    image: ${REGISTRY:?}/africair-api:${IMAGE_TAG:?}
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [database_url]
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    <<: *hardening
    restart: "no"

  api:
    image: ${REGISTRY:?}/africair-api:${IMAGE_TAG:?}
    deploy:
      replicas: 2
    env_file: config/${APP_ENV:?}.env
    environment:
      # The release label is runtime config: production shows v1.2.3 without rebuilding the image.
      APP_VERSION: ${IMAGE_TAG:?}
      DATABASE_URL_FILE: /run/secrets/database_url
      ADMIN_TOKEN_FILE: /run/secrets/admin_token
      PROMO_CODES_FILE: /run/secrets/promo_codes
    secrets: [database_url, admin_token, promo_codes]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    stop_grace_period: 20s
    <<: *hardening

  web:
    image: ${REGISTRY:?}/africair-web:${IMAGE_TAG:?}
    environment:
      API_UPSTREAM: http://api:4000
      APP_ENV: ${APP_ENV:?}
    ports:
      - "80:8080"
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend, backend]
    <<: *hardening

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  db-data: {}

secrets:
  db_password: { file: ./secrets/db_password }
  database_url: { file: ./secrets/database_url }
  admin_token: { file: ./secrets/admin_token }
  promo_codes: { file: ./secrets/promo_codes }
