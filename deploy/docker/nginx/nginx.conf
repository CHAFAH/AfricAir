# /etc/nginx/nginx.conf in africair-web. Everything nginx writes lives under /tmp, so the
# container runs with --read-only and a tmpfs (or an emptyDir in Kubernetes) on /tmp.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Rendered by the image entrypoint from /etc/nginx/templates/*.template (NGINX_ENVSUBST_OUTPUT_DIR).
  include /tmp/nginx-conf/*.conf;
}
