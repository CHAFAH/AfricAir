upstream africair_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _; # Configure your live domain or EC2 public IP here

    # Compress transmission payloads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Frontend Assets Routing
    location / {
        root /var/www/africair/current/dist;
        index index.html;
    }

    # Highly-Aggressive Browser Caching for Hashed Bundles
    location /assets/ {
        root /var/www/africair/current/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API Backend Reverse Proxy
    location /api/ {
        proxy_pass http://africair_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
