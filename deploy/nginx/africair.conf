log_format africair_json escape=json '{'
  '"time":"$time_iso8601",'
  '"timestamp":$msec,'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"path":"$uri",'
  '"request":"$request",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"referer":"$http_referer",'
  '"user_agent":"$http_user_agent",'
  '"request_time":$request_time'
'}';

map $uri $africair_cache_control {
  default         "";
  ~^/assets/      "public, max-age=31536000, immutable";
  /index.html     "no-cache";
  /version.json   "no-cache";
}

upstream africair_api {
  server 127.0.0.1:4000;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /opt/africair/current;
  index index.html;
  server_tokens off;

  access_log /var/log/nginx/africair.access.json africair_json;
  error_log /var/log/nginx/africair.error.log warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types
    application/javascript
    application/json
    image/svg+xml
    text/css;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:" always;
  add_header Cache-Control $africair_cache_control always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /index.html {
    try_files $uri =404;
  }

  location = /version.json {
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://africair_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
