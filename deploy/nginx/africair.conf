# /etc/nginx/sites-available/africair (installed by scripts/ops/bootstrap.sh)
# Static front end from /opt/africair/current, API proxied to 127.0.0.1:4000.

# One JSON object per line; `escape=json` makes user-controlled values (URI, user agent) safe.
log_format africair_json escape=json
  '{"time":"$time_iso8601","msec":"$msec","remote_addr":"$remote_addr",'
  '"request_method":"$request_method","uri":"$request_uri","status":$status,'
  '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_addr":"$upstream_addr","upstream_response_time":"$upstream_response_time",'
  '"http_referer":"$http_referer","http_user_agent":"$http_user_agent",'
  '"x_forwarded_for":"$http_x_forwarded_for"}';

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /opt/africair/current;
  index index.html;
  server_tokens off;
  access_log /var/log/nginx/africair.access.json africair_json;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types application/javascript text/javascript text/css application/json image/svg+xml text/plain;

  # add_header is inherited only by locations that define none of their own,
  # so every location that sets Cache-Control includes the security headers again.
  include snippets/africair-security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Content-hashed file names: a changed file always has a new name, so it can be cached forever.
  location /assets/ {
    include snippets/africair-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Entry points must be revalidated on every load, otherwise users keep an old release.
  location = /index.html {
    include snippets/africair-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /version.json {
    include snippets/africair-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    client_max_body_size 64k;
    include snippets/africair-security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Hash routing (/#/flights?...): the browser only ever requests "/", /index.html and /assets/*.
  # "$uri/" lets `index` map "/" to /index.html (and so to its no-cache location); anything else is a 404.
  location / {
    try_files $uri $uri/ =404;
  }
}
