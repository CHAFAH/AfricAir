server {
    listen 80;
    server_name _;
    root /opt/africair/current/dist;
    index index.html;

    access_log /var/log/nginx/africair.access.json json_combined;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /healthz {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    location /metrics {
        deny all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'";
        try_files $uri $uri/ /index.html;
    }
}
