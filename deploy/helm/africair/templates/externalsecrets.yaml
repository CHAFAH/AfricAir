# africair-db → environment variables (DATABASE_URL) on the API, migration Job and backup job.
# Combines the RDS-managed secret (username, password; Secrets Manager) with host/port/name (Parameter Store).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "africair.fullname" . }}-db
  labels: {{- include "africair.labels" . | nindent 4 }}
  annotations: {{- include "africair.ordering" (dict "root" . "weight" "-10" "job" false) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.dbRefreshInterval }}
  target:
    name: {{ include "africair.fullname" . }}-db
    creationPolicy: {{ include "africair.creationPolicy" . }}
    template:
      engineVersion: v2
      data:
        # The password is URL-encoded: inside a URL, characters such as % # ? : would end the userinfo
        # part or start an escape. (RDS passwords never contain / @ " or spaces.)
        DATABASE_URL: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password | urlquery }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ `{{ .dbname }}` }}?sslmode=require"
  data:
    - secretKey: username
      sourceRef:
        storeRef: { name: {{ .Values.secrets.secretsManagerStore }}, kind: ClusterSecretStore }
      remoteRef: { key: {{ required "secrets.dbMasterSecretArn is required" .Values.secrets.dbMasterSecretArn | quote }}, property: username }
    - secretKey: password
      sourceRef:
        storeRef: { name: {{ .Values.secrets.secretsManagerStore }}, kind: ClusterSecretStore }
      remoteRef: { key: {{ .Values.secrets.dbMasterSecretArn | quote }}, property: password }
    - secretKey: host
      sourceRef:
        storeRef: { name: {{ .Values.secrets.parameterStore }}, kind: ClusterSecretStore }
      remoteRef: { key: {{ printf "%s/host" .Values.secrets.dbParameterPrefix | quote }} }
    - secretKey: port
      sourceRef:
        storeRef: { name: {{ .Values.secrets.parameterStore }}, kind: ClusterSecretStore }
      remoteRef: { key: {{ printf "%s/port" .Values.secrets.dbParameterPrefix | quote }} }
    - secretKey: dbname
      sourceRef:
        storeRef: { name: {{ .Values.secrets.parameterStore }}, kind: ClusterSecretStore }
      remoteRef: { key: {{ printf "%s/name" .Values.secrets.dbParameterPrefix | quote }} }
---
# africair-app → files mounted at {{ .Values.secrets.mountPath }} (ADMIN_TOKEN, PROMO_CODES): rotations reach
# the running pods through ESO (1m) → kubelet volume sync (~1m) → the app's file refresh (15 s).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "africair.fullname" . }}-app
  labels: {{- include "africair.labels" . | nindent 4 }}
  annotations: {{- include "africair.ordering" (dict "root" . "weight" "-10" "job" false) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.appRefreshInterval }}
  secretStoreRef: { name: {{ .Values.secrets.secretsManagerStore }}, kind: ClusterSecretStore }
  target:
    name: {{ include "africair.fullname" . }}-app
    creationPolicy: {{ include "africair.creationPolicy" . }}
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef: { key: {{ .Values.secrets.appSecretName | quote }}, property: ADMIN_TOKEN }
    - secretKey: PROMO_CODES
      remoteRef: { key: {{ .Values.secrets.appSecretName | quote }}, property: PROMO_CODES }
