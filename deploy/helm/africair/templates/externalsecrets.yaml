{{- if .Values.secrets.externalSecrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "africair.fullname" . }}-db
  labels: {{- include "africair.labels" . | nindent 4 }}
  annotations: {{- include "africair.ordering" (dict "root" . "weight" "-10" "job" false) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.dbRefreshInterval }}
  secretStoreRef: { name: {{ .Values.secrets.secretsManagerStore }}, kind: ClusterSecretStore }
  target:
    name: {{ include "africair.fullname" . }}-db
    creationPolicy: {{ include "africair.creationPolicy" . }}
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: {{ required "secrets.dbSecretName is required" .Values.secrets.dbSecretName | quote }}, property: DATABASE_URL }
---
# africair-app → files mounted at {{ .Values.secrets.mountPath }} (ADMIN_TOKEN, PROMO_CODES): rotations reach
# the running pods through ESO (1m) → kubelet volume sync (~1m) → the app's file refresh (15 s).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "africair.fullname" . }}-app
  labels: {{- include "africair.labels" . | nindent 4 }}
  annotations: {{- include "africair.ordering" (dict "root" . "weight" "-10" "job" false) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.appRefreshInterval }}
  secretStoreRef: { name: {{ .Values.secrets.secretsManagerStore }}, kind: ClusterSecretStore }
  target:
    name: {{ include "africair.fullname" . }}-app
    creationPolicy: {{ include "africair.creationPolicy" . }}
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef: { key: {{ .Values.secrets.appSecretName | quote }}, property: ADMIN_TOKEN }
    - secretKey: PROMO_CODES
      remoteRef: { key: {{ .Values.secrets.appSecretName | quote }}, property: PROMO_CODES }
{{- end }}
