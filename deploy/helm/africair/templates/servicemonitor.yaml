{{- if .Values.metrics.serviceMonitor.enabled }}
# Project 5: Prometheus (kube-prometheus-stack) scrapes the API's metrics port. 9464 is not behind the
# Ingress, and the NetworkPolicy only admits the monitoring namespace on it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "africair.fullname" . }}-api
  labels:
    {{- include "africair.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      relabelings:
        - targetLabel: app_env
          replacement: {{ .Values.api.env.APP_ENV | quote }}
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
{{- end }}
