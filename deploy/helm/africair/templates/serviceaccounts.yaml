{{- $root := . }}
{{- range $sa := list "web" "api" "migrate" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "africair.fullname" $root }}-{{ $sa }}
  labels: {{- include "africair.labels" $root | nindent 4 }}
  {{- if eq $sa "migrate" }}
  annotations: {{- include "africair.ordering" (dict "root" $root "weight" "-20" "job" false) | nindent 4 }}
  {{- end }}
# None of the app pods call the Kubernetes API.
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # Fixed name: the Pod Identity association (Terraform, modules/platform) targets it.
  name: africair-backup
  labels: {{- include "africair.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
