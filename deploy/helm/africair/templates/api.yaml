{{- $name := printf "%s-api" (include "africair.fullname" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "africair.labels" . | nindent 4 }}
  annotations:
    # DATABASE_URL is an env var: a rotated RDS password only reaches pods through a restart, which
    # Stakater Reloader triggers when ESO updates this Secret.
    secret.reloader.stakater.com/reload: {{ include "africair.fullname" . }}-db
    {{- if .Values.gitops.enabled }}
    argocd.argoproj.io/sync-wave: "1" # after the migration Job (wave 0)
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "africair.selector" (dict "root" . "component" "api") | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "africair.selector" (dict "root" . "component" "api") | nindent 8 }}
      annotations:
        # Settings are env vars: a new checksum rolls the pods whenever values change them.
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      securityContext: {{- include "africair.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "africair.selector" (dict "root" . "component" "api") | nindent 14 }}
      containers:
        - name: api
          image: {{ include "africair.image" (dict "root" . "name" "africair-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 4000 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: {{ $name }} }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ include "africair.fullname" . }}-db, key: DATABASE_URL }
          # startup: up to 60 s for the first start; liveness and readiness are off until it passes.
          startupProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # liveness: is the process wedged? Never touches the database, or an RDS outage would restart
          # every pod for nothing.
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # readiness: should it get traffic? 503 while the database is unreachable or during shutdown,
          # so it is quick to react (2 × 5 s).
          readinessProbe:
            httpGet: { path: /api/readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext: {{- include "africair.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: app-secrets, mountPath: {{ .Values.secrets.mountPath }}, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: app-secrets
          secret:
            secretName: {{ include "africair.fullname" . }}-app
            defaultMode: 0440
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "africair.labels" . | nindent 4 }}
    app.kubernetes.io/name: api
  annotations:
    # The ALB checks readiness, not liveness: a pod that can't reach the database must stop receiving traffic.
    alb.ingress.kubernetes.io/healthcheck-path: /api/readyz
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
spec:
  selector: {{- include "africair.selector" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - { name: http, port: 4000, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
