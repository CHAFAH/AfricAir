{{- if .Values.ingress.enabled }}
{{- $tls := ne .Values.ingress.certificateArn "" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "africair.fullname" . }}
  labels: {{- include "africair.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # Targets are pod IPs: no NodePort hop, and readiness gates can hold a rollout until the ALB sees the pod healthy.
    alb.ingress.kubernetes.io/target-type: ip
    # One ALB shared by every Ingress in the group (app, Argo CD, Grafana).
    alb.ingress.kubernetes.io/group.name: {{ .Values.ingress.groupName }}
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds={{ .Values.ingress.deregistrationDelaySeconds }}
    {{- if $tls }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "africair.fullname" . }}-api
                port: { name: http }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "africair.fullname" . }}-web
                port: { name: http }
{{- end }}
