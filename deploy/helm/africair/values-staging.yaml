image:
  registry: "REGISTRY_PLACEHOLDER"
  tag: "TAG_PLACEHOLDER"

web:
  replicas: 1
  env:
    APP_ENV: staging

api:
  replicas: 1
  env:
    APP_ENV: staging
    BRAND_NAME: AfricAir Staging
    ANNOUNCEMENT_TEXT: "Running on Amazon EKS — staging"
    ANNOUNCEMENT_LEVEL: info
    SERVICE_FEE_USD: "7"
    DEFAULT_CURRENCY: KES
    MAINTENANCE_MODE: "false"
    DB_SSL: require

ingress:
  host: ""
  certificateArn: ""

autoscaling:
  enabled: false

# Creates the schema before every install/upgrade (Helm pre-install/pre-upgrade hook).
# Needs the africair-db Secret, which the pipeline creates before running helm.
migrations:
  enabled: true

networkPolicy:
  enabled: false

backup:
  enabled: false

metrics:
  serviceMonitor:
    enabled: false

secrets:
  externalSecrets: false
  appSecretName: africair/stg/app
  dbSecretName: africair/stg/db
