# Staging (terraform -var-file=stg.tfvars). Install with:
#   helm upgrade --install africair deploy/helm/africair -n africair-staging --create-namespace \
#     -f deploy/helm/africair/values-staging.yaml --set image.registry=<ecr_registry> --set image.tag=v1.0
image:
  registry: ""   # terraform output ecr_registry
  tag: v1.0

web:
  env:
    APP_ENV: staging

api:
  env:
    APP_ENV: staging
    BRAND_NAME: AfricAir Staging
    ANNOUNCEMENT_TEXT: "Running on Amazon EKS — staging"
    ANNOUNCEMENT_LEVEL: info
    SERVICE_FEE_USD: "7"
    DEFAULT_CURRENCY: KES
    MAINTENANCE_MODE: "false"
    DB_SSL: require

secrets:
  appSecretName: africair/stg/app   # created by Terraform
  dbSecretName: africair/stg/db

ingress:
  host: ""
  certificateArn: ""

backup:
  enabled: false
