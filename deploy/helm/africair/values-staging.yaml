# Staging settings. Cluster-specific values (registry, RDS secret ARN, bucket) are in gitops/values/cluster.yaml
# (generated by `make configure`). `make helm-install` passes both files.
image:
  tag: ""                                                  # set by CI (--set image.tag=<sha>)

web:
  env:
    APP_ENV: staging

api:
  env:
    APP_ENV: staging
    BRAND_NAME: AfricAir Staging
    ANNOUNCEMENT_TEXT: "Running on Amazon EKS — staging"
    ANNOUNCEMENT_LEVEL: info
    SERVICE_FEE_USD: "7"
    DEFAULT_CURRENCY: KES
    MAINTENANCE_MODE: "false"
    DB_SSL: require          # stretch: verify, with the RDS CA bundle mounted from a ConfigMap

secrets:
  appSecretName: africair/staging/app

ingress:
  host: ""                   # staging.<domain> when you have one

backup:
  enabled: true
  prefix: africair/staging
