# helm upgrade --install africair deploy/helm/africair -n africair-staging --create-namespace \
#   -f deploy/helm/africair/values-staging.yaml -f values-staging.local.yaml   # registry, ARN, host
image:
  registry: 123456789012.dkr.ecr.eu-west-1.amazonaws.com   # terraform output ecr_repository_urls
  tag: ""                                                  # set by CI (--set image.tag=<sha>)

web:
  env:
    APP_ENV: staging

api:
  env:
    APP_ENV: staging
    BRAND_NAME: AfricAir Staging
    ANNOUNCEMENT_TEXT: "Running on Amazon EKS — staging"
    ANNOUNCEMENT_LEVEL: info
    SERVICE_FEE_USD: "7"
    DEFAULT_CURRENCY: KES
    MAINTENANCE_MODE: "false"
    DB_SSL: require          # stretch: verify, with the RDS CA bundle mounted from a ConfigMap

secrets:
  appSecretName: africair/staging/app
  dbMasterSecretArn: arn:aws:secretsmanager:eu-west-1:123456789012:secret:rds!db-00000000-0000-0000-0000-000000000000-AbCdEf
  dbParameterPrefix: /africair/staging/db

ingress:
  host: ""                   # staging.<domain> when you have one
  certificateArn: ""         # terraform output acm_certificate_arn

backup:
  enabled: true
  bucket: africair-team1-staging-backups-123456789012   # terraform output backup_bucket
  prefix: africair/staging
